name: CBE event dispatch tests

on:
  pull_request:
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'api/admin/approvals.js'
      - 'lib/cbe-auto-worker.js'
      - 'tools/test-cbe-auto-approval.cjs'
      - '.github/workflows/cbe-event-dispatch-tests.yml'
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'api/admin/approvals.js'
      - 'lib/cbe-auto-worker.js'
      - 'tools/test-cbe-auto-approval.cjs'
      - '.github/workflows/cbe-event-dispatch-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --prefix functions --no-audit --no-fund
      - name: Validate worker and Firebase trigger syntax
        run: |
          node --check api/admin/approvals.js
          node --check lib/cbe-auto-worker.js
          node --check functions/index.js
          node -e "if (typeof require('./functions').dispatchCbeAutoApproval !== 'function') process.exit(1)"
      - name: Test existing CBE approval safeguards plus targeted leases
        run: node --test tools/test-cbe-auto-approval.cjs
      - name: Test event dispatcher failure handling
        run: npm test --prefix functions
