name: PR36 wallet and RF-only integration safety
on:
  pull_request:
    paths:
      - 'lib/wallet-core.js'
      - 'lib/payment-evidence-mode.js'
      - 'lib/payment-claims.js'
      - 'lib/wallet-deposit-verification.js'
      - 'lib/wallet-runtime-policy.js'
      - 'api/admin/approvals.js'
      - 'api/customer/create-request.js'
      - 'admin/js/general.js'
      - 'tools/test-wallet-core.cjs'
      - 'tools/test-wallet-deposit-verification.cjs'
      - 'tools/test-wallet-runtime-policy.cjs'
      - 'tools/test-wallet-emulator.cjs'
      - 'tools/test-wallet-api-emulator.cjs'
      - 'tools/test-payment-evidence-mode.cjs'
      - '.github/workflows/wallet-rf-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wallet-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-tigray-wallet-pr36
      CI: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: java -version
      - run: npm ci --ignore-scripts
      - name: Monetary and evidence unit tests
        run: node --test tools/test-wallet-core.cjs tools/test-wallet-deposit-verification.cjs tools/test-wallet-runtime-policy.cjs tools/test-payment-evidence-mode.cjs
      - name: Real isolated Firestore financial transaction tests
        run: |
          npx firebase --config firebase.emulator.json \
            --project demo-tigray-wallet-pr36 \
            emulators:exec --only firestore \
            'node --test tools/test-wallet-emulator.cjs tools/test-wallet-api-emulator.cjs'
