<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lottery Admin · Tigray Lottery V5</title><link rel="stylesheet" href="admin.css"></head>
<body><header class="admin-header"><div class="title">🎟️ Lottery Admin <span id="lotteryName"></span></div><button id="logoutBtn">Logout</button></header><main class="admin-wrap"><div id="message"></div>
<section class="panel"><h2>My Lottery</h2><div id="lotteryInfo">Loading…</div><div class="actions"><button id="editBtn">Rename / Change Price</button><button class="secondary" id="refreshBtn">↻ Refresh</button></div></section>
<section class="panel"><div class="summary-head"><div><h2>💳 Pending Payment Requests</h2><div id="pendingCount" class="muted">Loading…</div></div></div><p class="muted">Approve/reject here. Once reviewed, the request card disappears. Approved requests are kept in the summary below.</p><div id="requests">Loading…</div></section>
<section class="panel"><div class="summary-head"><div><h2>📊 Approved Summary</h2><div id="summaryCount" class="muted"></div></div></div><div class="actions"><button id="downloadCsv">⬇ Download CSV</button><button class="secondary" id="copyExcel">📋 Copy for Excel</button></div><div id="summaryMessage"></div><div id="summaryTable" class="table-wrap"></div></section>
<div id="summaryPanel" style="display:none"></div><button id="closeSummary" style="display:none">Close</button>
</main><script type="module" src="js/lottery.js"></script></body></html>
