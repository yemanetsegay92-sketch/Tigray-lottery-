<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tigray Lottery Admin</title><link rel="stylesheet" href="../style.css"></head><body><header><b>🎟️ Tigray Lottery Admin</b><button onclick="sessionStorage.removeItem('tigrayAdmin');location='login.html'">Logout</button></header><main class="admin-wrap"><div class="top-actions"><button onclick="showCreate()">➕ Create Lottery</button><button class="secondary" onclick="render()">↻ Refresh</button></div><section class="panel" id="createPanel" style="display:none"><h2>Create / Edit Lottery</h2><form id="lotForm"><input type="hidden" id="editId"><div class="two"><label>Name<input id="lotName" required placeholder="Lot 1"></label><label>Ticket Price (Birr)<input id="price" type="number" required></label><label>Minimum Number<input id="min" type="number" required></label><label>Maximum Number<input id="max" type="number" required></label><label>Status<select id="status"><option value="active">Active</option><option value="upcoming">Upcoming</option><option value="closed">Closed</option></select></label></div><button>Save Lottery</button></form></section><section class="panel"><h2>🎟️ Manage Lotteries</h2><div id="lotteries"></div></section><section class="panel"><h2>💳 Payment Requests</h2><div id="requests"></div></section></main><script src="admin.js"></script></body></html>
