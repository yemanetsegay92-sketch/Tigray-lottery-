<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tigray Lottery Admin</title><link rel="stylesheet" href="../style.css"></head><body>
<header><b>🎟️ Tigray Lottery Admin</b><button id="logoutBtn">Logout</button></header>
<main class="admin-wrap">
  <div class="top-actions"><button id="showCreateBtn">➕ Create Lottery</button><button class="secondary" id="refreshBtn">↻ Refresh</button></div>
  <div id="message"></div>
  <section class="panel" id="createPanel" style="display:none"><h2>Create Lottery</h2><form id="lotForm"><div class="two"><label>Name<input id="lotName" required placeholder="Lot 1"></label><label>Ticket Price (Birr)<input id="price" type="number" min="1" required></label><label>Minimum Number<input id="min" type="number" required></label><label>Maximum Number<input id="max" type="number" required></label><label>Status<select id="status"><option value="active">Active</option><option value="upcoming">Upcoming</option><option value="closed">Closed</option></select></label></div><button type="submit">Save Lottery</button></form></section>
  <section class="panel"><h2>🎟️ Manage Lotteries</h2><div id="lotteries">Loading…</div></section>
  <section class="panel"><h2>💳 Payment Requests</h2><div id="requests">Loading…</div></section>
</main>
<script type="module" src="admin.js"></script></body></html>
