<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>General Admin · Tigray Lottery</title><link rel="stylesheet" href="admin.css"></head>
<body><header class="admin-header"><div class="title">🎟️ General Admin</div><button id="logoutBtn">Logout</button></header><main class="admin-wrap"><div id="message"></div>
<section class="panel"><h2>➕ Create Lottery</h2><form id="createForm"><div class="grid2"><label>Name<input id="name" required placeholder="Lottery 001"></label><label>Ticket Price (Birr)<input id="price" type="number" min="1" required></label><label>Minimum Number<input id="min" type="number" required value="100000"></label><label>Maximum Number<input id="max" type="number" required value="999999"></label><label>Status<select id="status"><option value="active">Active</option><option value="upcoming">Upcoming</option><option value="closed">Closed</option></select></label><label>Description<input id="description" placeholder="Optional short description"></label></div><button>Create Lottery</button></form></section>
<section class="panel"><h2>🎟️ Lotteries</h2><div id="lotteries">Loading…</div></section>
<section class="panel"><h2>👤 Add Lottery Admin</h2><p class="muted">Creates a Firebase login for one lottery admin without signing out the general admin.</p><form id="adminForm"><div class="grid2"><label>Email<input id="adminEmail" type="email" required></label><label>Temporary Password<input id="adminPassword" type="password" minlength="6" required></label><label>Display Name<input id="adminName" required></label><label>Assign Lottery<select id="adminLottery" required></select></label></div><button class="purple">Create Lottery Admin</button></form><div id="adminMessage"></div></section>
<section class="panel"><h2>📋 All Payment Requests</h2><div id="requests">Loading…</div></section>
</main><script type="module" src="js/general.js"></script></body></html>
